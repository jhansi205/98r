<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="shortcut icon" href="images/weather1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #9D9693;
            overflow-x: hidden;
        }

        form {
            display: flex;
            width: 300px;
            height: 44px;
            margin: 20px auto;
            border-radius: 5px;
        }

        
        .search-input {
            padding: 6px 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px 0 0 5px; 
            height: 100%;
            width: 100%;
        }

       
        .search-button {
            width: 44px;
            height: 44px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-button i {
            font-size: 18px;
        }

        .locations {
            border: 1px solid white;
            background-image: url(images/nature-sky-clouds-sun-wallpaper-preview.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            height: 600px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
       
        h1 {
            font-size: 140px;
            margin: 0;
        }
        
        h3 {
            font-size: 28px;
            margin-top: 20px;
        }

        .weather-container {
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(135, 206, 235);
            width: 50%;
            margin: 20px auto;
            text-align: center;
            display: flex;
            flex-direction: row;
            padding: 15px;
        }
        .weather-temperature h6{
            text-align: center;
        }

        .weather-temperature img{
            width: 70px;
            height: 70px;
            padding: 10px;
        }

        .map {
            text-align: center;
            margin: 20px auto;
        }
        @media screen and (max-width: 1024px) {
            h1 {
                font-size: 100px;
            }

            h3 {
                font-size: 24px;
            }

            form {
                max-width: 400px;
                width: 100%;
            }

            .weather-container {
                width: 80%;
                display: flex;
                flex-direction: row;
                margin-left: 8px;
                
            }

            .weather-temperature img {
                width: 55px;
                height: 55px;
                padding-left: 10px;
            }
            .map iframe {
                width: 100%;
                height: 300px;
            }
        }
        @media screen and (max-width: 768px){
            h1{
                font-size: 80px;
            }
            h3{
                font-size: 20px;
            }
            form{
                max-width: 300px;
                width: 100%;
            }
            .weather-container {
                width: 85%;
                display: flex;
                flex-direction: row;
                padding: 10px;

            }
            .weather-temperature img {
                width: 40px;
                height: 40px;
            }
            h6{
                font-size: 9px;
            }
            .map iframe {
                width: 100%;
                height: 300px;
            }

        }
        @media screen and (max-width: 425px) {
            h1 {
                font-size: 60px;
            }

            h3 {
                font-size: 18px;
            }

            form {
                max-width: 250px;
                width: 100%;
            }

            .weather-container {
                width: 100%;
                display: flex;
                flex-direction: row;
            }

            .weather-temperature img {
                width: 30px;
                height: 30px;
            }
            h6{
                font-size: 9px;
            }
            .map iframe {
                width: 100%;
                height: 200px;
            }
        }
        @media screen and (max-width: 320px) {
            h1 {
                font-size: 40px;
            }

            h3 {
                font-size: 14px;
            }

            form {
                max-width: 250px;
                width: 100%;
            }

            .weather-container {
                width: 100%;
                display: flex;
                flex-direction: row;
            }

            .weather-temperature img {
                width: 20px;
                height: 20px;
            }
            h6{
                font-size: 6px;
            }
            .map iframe {
                width: 100%;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <form id="form">
        <input type="text" class="search-input" placeholder="Search">
        <button class="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>

    <div class="locations" id="location"> 
        <div class="weather">  
            <h1>29&#176;C</h1>
            <h3>Unagatla, East Godavari</h3>
        </div>
    </div>

    <div class="weather-container">
       <div class="weather-temperature">
        <h6>1:00 pm</h6>
        <img src="images/sun-2.png" alt="sun">
        <h6>33&#176;</h6> 
       </div>
       <div class="weather-temperature">
        <h6>2:00 pm</h6>
        <img src="images/sun-2.png" alt="sun">
        <h6>32&#176;</h6> 
       </div>
       <div class="weather-temperature">
        <h6>3:00 pm</h6>
        <img src="images/sun-2.png" alt="sun">
        <h6>31&#176;</h6> </div>
        <div class="weather-temperature">
        <h6>4:00 pm</h6>
        <img src="images/sun-2.png" alt="sun">
        <h6>31&#176;</h6> 
       </div>
       <div class="weather-temperature">
       <h6>5:00 pm</h6>
       <img src="images/sun3.png" alt="sun">
       <h6>31&#176;</h6> 
    </div>
    <div class="weather-temperature">
    <h6>5:54 pm</h6>
    <img src="images/sunset.jpeg" alt="sun">
    <h6>31&#176;</h6> 
    </div>
    <div class="weather-temperature">
    <h6>6:00 pm</h6>
    <img src="images/moon.jpeg" alt="moon">
    <h6>30&#176;</h6> 
    </div>
    <div class="weather-temperature">
    <h6>7:00 pm</h6>
    <img src="images/moon.jpeg" alt="moon">
    <h6>30&#176;</h6> 
    </div>
    <div class="weather-temperature">
    <h6>8:00 pm</h6>
    <img src="images/moon.jpeg" alt="moon">
    <h6>29&#176;</h6> 
    </div>
    <div class="weather-temperature">
    <h6>9:00pm</h6>
    <img src="images/moon.jpeg" alt="moon">
    <h6>29&#176;</h6> 
    </div>
    <div class="weather-temperature">
        <h6>10:00 pm</h6>
        <img src="images/moon.jpeg" alt="moon">
        <h6>28&#176;</h6> 
        </div>
        <div class="weather-temperature">
        <h6>11:00 pm</h6>
        <img src="images/moon.jpeg" alt="moon">
        <h6>27&#176;</h6> 
        </div>
        <div class="weather-temperature">
        <h6>12:00 am</h6>
        <img src="images/moon.jpeg" alt="moon">
        <h6>27&#176;</h6> 
        </div>
    </div>

    <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15265.06913574549!2d81.6462994601854!3d16.96139801608738!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a37afba5488bdad%3A0x80ad86646b6d10cc!2sUnagatala%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1727618601415!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
</body>
</html>
